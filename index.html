<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiGame — Formation Préparateur de commandes</title>
<style>
  /* ── VARIABLES ── */
  :root{
    --bg:#0F1923;--surface:#162230;--card:#1C2E40;--border:#243A50;
    --accent:#00C2FF;--accent2:#FF6B35;--green:#00D68F;--red:#FF4757;
    --yellow:#FFD166;--text:#E8F4FD;--muted:#6B8FA8;--radius:14px;
    /* Touch targets minimum 48px */
    --touch:48px;
  }

  /* ── RESET ── */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh;
    /* Prevent text zoom on iOS when rotating */
    -webkit-text-size-adjust:100%;
  }

  /* ── HEADER ── */
  header{
    background:linear-gradient(135deg,#0A1520,#162230 60%,#1a2d1a);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:100;
  }
  .logo-icon{
    font-size:1.8rem;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--green));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .header-text{flex:1;min-width:0;}
  header h1{font-size:1.3rem;font-weight:800;letter-spacing:-.5px;white-space:nowrap;}
  header h1 span{color:var(--accent);}
  header p{font-size:.72rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .score-global{
    flex-shrink:0;
    background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:6px 12px;text-align:center;min-width:72px;
  }
  .score-global .val{font-size:1.2rem;font-weight:800;color:var(--accent);}
  .score-global .lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

  /* ── MENU ── */
  #menu{max-width:920px;margin:0 auto;padding:20px 14px 32px;}
  .menu-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .menu-title{font-size:.82rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);}
  .shuffle-btn{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:0 16px;height:var(--touch);font-size:.82rem;
    cursor:pointer;transition:border-color .15s;white-space:nowrap;
  }
  .shuffle-btn:active{border-color:var(--accent);background:rgba(0,194,255,.08);}
  /* Mobile : 1 colonne, desktop : grille */
  .game-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .game-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 16px;cursor:pointer;
    transition:border-color .15s,box-shadow .15s;
    position:relative;overflow:hidden;
    /* Active state for mobile */
    -webkit-user-select:none;user-select:none;
  }
  .game-card:active{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,194,255,.15);}
  .game-card .tag{
    font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;
    padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:10px;
  }
  .tag-quiz  {background:rgba(0,194,255,.15);color:var(--accent);}
  .tag-action{background:rgba(255,107,53,.15);color:var(--accent2);}
  .tag-memory{background:rgba(0,214,143,.15);color:var(--green);}
  .tag-tri   {background:rgba(255,209,102,.18);color:var(--yellow);}
  .tag-ordre {background:rgba(142,68,173,.2);color:#C39BD3;}
  .game-card .card-body{display:flex;gap:14px;align-items:flex-start;}
  .game-card .emoji{font-size:2rem;flex-shrink:0;line-height:1.2;}
  .game-card .card-text{flex:1;}
  .game-card h3{font-size:.98rem;font-weight:700;margin-bottom:4px;}
  .game-card p{font-size:.8rem;color:var(--muted);line-height:1.5;}
  .game-card .stars{margin-top:8px;font-size:.76rem;color:var(--yellow);}
  .game-card .best-score{
    position:absolute;top:10px;right:10px;
    font-size:.66rem;color:var(--muted);
    background:var(--surface);border-radius:5px;padding:2px 7px;
  }

  /* ── GAME AREA ── */
  #game-area{display:none;max-width:760px;margin:0 auto;padding:14px 14px 40px;}
  .back-btn{
    background:none;border:1px solid var(--border);color:var(--muted);
    font-size:.85rem;padding:0 16px;height:var(--touch);
    border-radius:8px;cursor:pointer;margin-bottom:16px;
    display:inline-flex;align-items:center;
    transition:color .15s,border-color .15s;
  }
  .back-btn:active{color:var(--text);border-color:var(--accent);}

  /* HUD */
  .game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px;}
  .game-header h2{font-size:1.1rem;font-weight:800;flex:1;min-width:0;}
  .hud{display:flex;gap:7px;flex-shrink:0;}
  .hud-box{
    background:var(--card);border:1px solid var(--border);
    border-radius:8px;padding:4px 10px;text-align:center;min-width:52px;
  }
  .hud-box .v{font-size:.95rem;font-weight:800;}
  .hud-box .l{font-size:.58rem;color:var(--muted);text-transform:uppercase;}
  .hud-box.accent .v{color:var(--accent);}
  .hud-box.green .v{color:var(--green);}
  .hud-box.red .v{color:var(--red);}
  .hud-box.yellow .v{color:var(--yellow);}

  /* PROGRESS */
  .progress-bar{height:5px;background:var(--border);border-radius:3px;margin-bottom:16px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .4s;}

  /* QUIZ / CHRONO */
  .quiz-q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .quiz-q .num{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:6px;}
  .quiz-q .text{font-size:.98rem;font-weight:600;line-height:1.55;}
  /* 1 colonne par défaut sur mobile */
  .quiz-opts{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:12px;}
  .quiz-opt{
    background:var(--surface);border:2px solid var(--border);border-radius:11px;
    padding:0 14px;min-height:var(--touch);
    cursor:pointer;font-size:.9rem;text-align:left;line-height:1.4;
    display:flex;align-items:center;
    transition:border-color .15s,background .15s;
  }
  .quiz-opt:active{border-color:var(--accent);background:rgba(0,194,255,.07);}
  .quiz-opt.correct{border-color:var(--green);background:rgba(0,214,143,.1);}
  .quiz-opt.wrong{border-color:var(--red);background:rgba(255,71,87,.1);}
  .quiz-opt.disabled{pointer-events:none;}

  /* FEEDBACK */
  .quiz-feedback{
    padding:12px 14px;border-radius:10px;font-size:.88rem;font-weight:500;
    margin-bottom:12px;display:none;line-height:1.5;
  }
  .quiz-feedback.ok{background:rgba(0,214,143,.12);color:var(--green);border:1px solid rgba(0,214,143,.3);}
  .quiz-feedback.err{background:rgba(255,71,87,.12);color:var(--red);border:1px solid rgba(255,71,87,.3);}

  /* BUTTONS */
  .btn-next{
    background:var(--accent);color:#0F1923;border:none;border-radius:10px;
    padding:0 24px;height:var(--touch);
    font-weight:700;font-size:.92rem;cursor:pointer;display:none;
    width:100%;
  }
  .btn-next:active{filter:brightness(1.1);}
  .btn-replay{
    background:var(--accent);color:#0F1923;border:none;border-radius:10px;
    padding:0 22px;height:var(--touch);
    font-weight:700;cursor:pointer;font-size:.9rem;flex:1;
  }
  .btn-menu-r{
    background:none;border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:0 22px;height:var(--touch);
    font-weight:600;cursor:pointer;font-size:.9rem;flex:1;
  }

  /* RESULT */
  .result-screen{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;}
  .result-screen .medal{font-size:2.8rem;margin-bottom:10px;}
  .result-screen h3{font-size:1.3rem;font-weight:800;margin-bottom:6px;}
  .result-screen .pts{font-size:1.8rem;font-weight:800;color:var(--accent);margin:10px 0;}
  .result-screen p{color:var(--muted);margin-bottom:18px;font-size:.88rem;line-height:1.5;}
  .result-btns{display:flex;gap:10px;justify-content:center;}

  /* TRI DES RETOURS */
  /* Zones empilées en colonne sur mobile */
  .tri-zone-wrapper{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;}
  .tri-zone{
    background:var(--card);border:2px dashed var(--border);
    border-radius:var(--radius);padding:12px;min-height:80px;
    transition:border-color .2s,background .2s;
  }
  .tri-zone-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .tri-zone .zone-icon{font-size:1.3rem;}
  .tri-zone h4{font-size:.88rem;font-weight:700;}
  .tri-zone.zone-stock h4{color:var(--green);}
  .tri-zone.zone-sav h4{color:var(--yellow);}
  .tri-zone.zone-rebut h4{color:var(--red);}
  .tri-items-pool{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .tri-item{
    background:var(--surface);border:2px solid var(--border);border-radius:10px;
    padding:0 14px;min-height:var(--touch);
    cursor:pointer;font-size:.88rem;user-select:none;
    display:flex;align-items:center;
    transition:border-color .15s,background .15s;
  }
  .tri-item:active{border-color:var(--accent);}
  .tri-item.tri-selected{
    border-color:var(--yellow);background:rgba(255,209,102,.15);
    box-shadow:0 0 12px rgba(255,209,102,.25);
  }
  .tri-zone.tri-zone-active{cursor:pointer;border-style:solid;border-color:var(--muted);}
  .tri-zone.tri-zone-active:active{border-color:var(--accent);background:rgba(0,194,255,.05);}
  .dropped-item{
    background:var(--surface);border-radius:7px;
    padding:8px 10px;font-size:.82rem;margin:4px 0;
    border:1px solid var(--border);
  }
  .dropped-item.ok{border-color:var(--green);color:var(--green);}
  .dropped-item.err{border-color:var(--red);color:var(--red);}

  /* TROUVE L'ERREUR — cards au lieu de tableau sur mobile */
  .error-cards{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .error-card{
    background:var(--card);border:2px solid var(--border);
    border-radius:11px;padding:14px;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .error-card:active{border-color:var(--accent);background:rgba(0,194,255,.04);}
  .error-card.selected-ok{border-color:var(--green);background:rgba(0,214,143,.08);}
  .error-card.selected-err{border-color:var(--red);background:rgba(255,71,87,.08);}
  .error-card .ec-ref{font-size:.7rem;color:var(--accent);font-weight:700;margin-bottom:3px;}
  .error-card .ec-name{font-size:.92rem;font-weight:600;margin-bottom:6px;}
  .error-card .ec-qty{display:flex;gap:14px;font-size:.82rem;color:var(--muted);}
  .error-card .ec-qty span strong{color:var(--text);}

  /* MEMORY — 2 colonnes sur mobile */
  .memory-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .mem-card{
    background:var(--card);border:2px solid var(--border);border-radius:11px;
    min-height:80px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:.78rem;text-align:center;padding:8px;
    transition:border-color .15s,background .15s;
    user-select:none;
  }
  .mem-card .front{display:none;flex-direction:column;align-items:center;gap:4px;line-height:1.3;}
  .mem-card .back{display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
  .mem-card.flipped .front{display:flex;}
  .mem-card.flipped .back{display:none;}
  .mem-card.flipped{border-color:var(--accent);background:rgba(0,194,255,.05);}
  .mem-card.matched{border-color:var(--green);background:rgba(0,214,143,.08);pointer-events:none;}
  .mem-card:active:not(.matched):not(.flipped){border-color:var(--muted);}

  /* DRIVE */
  .drive-order{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
    padding:14px;display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;
  }
  .drive-order .car{font-size:1.8rem;flex-shrink:0;}
  .drive-order .order-desc strong{display:block;font-size:.95rem;margin-bottom:3px;}
  .drive-order .order-desc span{color:var(--muted);font-size:.83rem;line-height:1.4;}
  .drive-btns{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .drive-btn{
    background:var(--surface);border:2px solid var(--border);border-radius:10px;
    padding:0 14px;min-height:var(--touch);
    cursor:pointer;font-size:.88rem;text-align:left;
    display:flex;align-items:center;
    transition:border-color .15s,background .15s;
  }
  .drive-btn:active{border-color:var(--accent);}
  .drive-btn.correct{border-color:var(--green);background:rgba(0,214,143,.1);color:var(--green);font-weight:700;pointer-events:none;}
  .drive-btn.wrong{border-color:var(--red);background:rgba(255,71,87,.1);color:var(--red);pointer-events:none;}
  .timer-bar{height:6px;background:var(--border);border-radius:3px;margin-bottom:12px;}
  .timer-fill{height:100%;border-radius:3px;transition:width .1s linear;}

  /* PALETTE */
  .palette-pool{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .palette-item{
    background:var(--surface);border:2px solid var(--border);border-radius:10px;
    padding:0 14px;min-height:var(--touch);
    cursor:pointer;font-size:.88rem;display:flex;align-items:center;gap:10px;
    transition:border-color .15s,background .15s;
  }
  .palette-item:active{border-color:var(--accent);}
  .palette-item.pal-selected{border-color:var(--yellow);background:rgba(255,209,102,.12);}
  .palette-item.pal-placed{opacity:.3;pointer-events:none;}
  .palette-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .palette-slot{
    background:var(--card);border:2px dashed var(--border);border-radius:10px;
    padding:0 14px;min-height:var(--touch);font-size:.88rem;
    display:flex;align-items:center;gap:10px;
    transition:border-color .2s,background .2s;cursor:pointer;
  }
  .palette-slot:active{border-color:var(--accent);background:rgba(0,194,255,.04);}
  .palette-slot.filled-ok{border-color:var(--green);border-style:solid;background:rgba(0,214,143,.07);}
  .palette-slot.filled-err{border-color:var(--red);border-style:solid;background:rgba(255,71,87,.07);}
  .palette-slot .slot-num{font-size:.72rem;font-weight:700;color:var(--muted);min-width:60px;flex-shrink:0;}
  .slot-placeholder{color:var(--muted);font-size:.82rem;font-style:italic;}

  /* VRAI/FAUX */
  .chrono-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .chrono-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .chrono-choice{
    background:var(--surface);border:2px solid var(--border);border-radius:11px;
    padding:0 10px;min-height:56px;
    cursor:pointer;font-size:.92rem;font-weight:700;text-align:center;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s,background .15s;
  }
  .chrono-choice:active{border-color:var(--accent);}
  .chrono-choice.correct{border-color:var(--green);background:rgba(0,214,143,.1);}
  .chrono-choice.wrong{border-color:var(--red);background:rgba(255,71,87,.1);}
  .chrono-choice.disabled{pointer-events:none;}

  /* PENDU */
  .pendu-word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
  .pendu-letter{
    width:32px;height:40px;border-bottom:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;font-weight:700;text-transform:uppercase;
  }
  .pendu-alpha{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
  .pendu-btn{
    background:var(--surface);border:1.5px solid var(--border);border-radius:8px;
    width:42px;height:42px;cursor:pointer;
    font-size:.88rem;font-weight:700;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s,background .15s;
  }
  .pendu-btn:active{border-color:var(--accent);}
  .pendu-btn.used-ok{border-color:var(--green);background:rgba(0,214,143,.1);color:var(--green);pointer-events:none;}
  .pendu-btn.used-err{border-color:var(--red);background:rgba(255,71,87,.1);color:var(--red);pointer-events:none;}

  /* BONNE DECISION */
  .rapid-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .rapid-scenario{font-size:.95rem;font-weight:600;line-height:1.55;margin-bottom:14px;}
  .rapid-choices{display:flex;flex-direction:column;gap:9px;}
  .rapid-choice{
    background:var(--surface);border:2px solid var(--border);border-radius:10px;
    padding:0 14px;min-height:var(--touch);
    cursor:pointer;font-size:.88rem;line-height:1.4;
    display:flex;align-items:center;
    transition:border-color .15s,background .15s;
  }
  .rapid-choice:active{border-color:var(--accent);}
  .rapid-choice.correct{border-color:var(--green);background:rgba(0,214,143,.1);}
  .rapid-choice.wrong{border-color:var(--red);background:rgba(255,71,87,.1);}
  .rapid-choice.disabled{pointer-events:none;}

  /* ── DESKTOP (≥ 600px) ── */
  @media(min-width:600px){
    header{padding:18px 24px;}
    header h1{font-size:1.6rem;}
    #menu{padding:28px 20px 40px;}
    #game-area{padding:20px 20px 40px;}
    .game-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
    .game-card .card-body{flex-direction:column;}
    .quiz-opts{grid-template-columns:1fr 1fr;}
    .chrono-choices{grid-template-columns:1fr 1fr;}
    .tri-zone-wrapper{grid-template-columns:1fr 1fr 1fr;}
    .memory-grid{grid-template-columns:repeat(4,1fr) !important;}
    .drive-btns{flex-direction:row;flex-wrap:wrap;}
    .drive-btn{flex:1;min-width:45%;}
    .mem-card{min-height:90px;}
    .btn-next{width:auto;}
  }
  @media(min-width:600px){
    .game-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 28px rgba(0,194,255,.12);}
    .back-btn:hover{color:var(--text);border-color:var(--accent);}
    .quiz-opt:hover{border-color:var(--accent);background:rgba(0,194,255,.05);}
    .drive-btn:hover{border-color:var(--accent);background:rgba(0,194,255,.07);}
    .tri-zone.tri-zone-active:hover{border-color:var(--accent);background:rgba(0,194,255,.05);}
    .palette-slot:hover{border-color:var(--accent);background:rgba(0,194,255,.04);}
    .error-card:hover{border-color:var(--accent);background:rgba(0,194,255,.04);}
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">📦</div>
  <div class="header-text">
    <h1>Logi<span>Game</span></h1>
    <p>Formation — Préparateur de commandes</p>
  </div>
  <div class="score-global">
    <div class="val" id="total-score">0</div>
    <div class="lbl">Points</div>
  </div>
</header>

<div id="menu">
  <div class="menu-header">
    <p class="menu-title">Choisis ton mini-jeu</p>
    <button class="shuffle-btn" onclick="shuffleMenu()">🔀 Mélanger</button>
  </div>
  <div class="game-grid" id="game-grid"></div>
</div>

<div id="game-area">
  <button class="back-btn" onclick="backToMenu()">← Retour au menu</button>
  <div id="game-content"></div>
</div>

<script>
// ══════════════════════════════════════════════════
// CATALOGUE DES JEUX
// ══════════════════════════════════════════════════
const ALL_GAMES = [
  { id:'quiz',    emoji:'🧠', tag:'tag-quiz',   tagLabel:'Quiz',      title:'Quiz Chrono',         desc:'10 questions sur le picking, WMS, CACES… Réponds avant la fin du temps !',              stars:'★★★☆☆ Difficulté moyenne' },
  { id:'tri',     emoji:'📦', tag:'tag-tri',    tagLabel:'Tri',       title:'Trie les retours',    desc:'Sélectionne chaque produit puis place-le dans la bonne zone : stock, SAV ou rebut.',   stars:'★★☆☆☆ Facile' },
  { id:'error',   emoji:'🔍', tag:'tag-action', tagLabel:'Détection', title:'Trouve l\'erreur',    desc:'Une commande est prête à partir. Repère l\'article incorrect avant l\'expédition.',    stars:'★★★★☆ Difficile' },

let totalScore = 0;
let bestScores = {};
ALL_GAMES.forEach(g => bestScores[g.id] = 0);
let currentGame = null;
let displayedGames = [];

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function shuffleMenu() {
  displayedGames = shuffle([...ALL_GAMES]).slice(0, 6);
  renderMenu();
}

function renderMenu() {
  const grid = document.getElementById('game-grid');
  grid.innerHTML = displayedGames.map(g => `
    <div class="game-card" onclick="startGame('${g.id}')">
      <span class="tag ${g.tag}">${g.tagLabel}</span>
      <span class="best-score" id="best-${g.id}">${bestScores[g.id] > 0 ? '🏆 '+bestScores[g.id] : '—'}</span>
      <div class="card-body">
        <span class="emoji">${g.emoji}</span>
        <div class="card-text">
          <h3>${g.title}</h3>
          <p>${g.desc}</p>
          <div class="stars">${g.stars}</div>
        </div>
      </div>
    </div>`).join('');
}

function addScore(n) {
  totalScore += n;
  document.getElementById('total-score').textContent = totalScore;
}

function showBestScore(game, score) {
  if(score > bestScores[game]) {
    bestScores[game] = score;
    const el = document.getElementById('best-'+game);
    if(el) el.textContent = '🏆 '+score;
  }
}

function startGame(name) {
  currentGame = name;
  document.getElementById('menu').style.display = 'none';
  const ga = document.getElementById('game-area');
  ga.style.display = 'block';
  window.scrollTo(0,0);
  const gc = document.getElementById('game-content');
  gc.innerHTML = '';
  const fns = {quiz:initQuiz,tri:initTri,error:initError,memory:initMemory,drive:initDrive,palette:initPalette,chrono:initChrono,pendu:initPendu,rapid:initRapid};
  if(fns[name]) fns[name](gc);
}

function backToMenu() {
  document.getElementById('menu').style.display = 'block';
  document.getElementById('game-area').style.display = 'none';
  currentGame = null;
}

function showResult(container, score, max, title, detail) {
  const pct = Math.round((score/max)*100);
  const medal = pct>=80?'🥇':pct>=50?'🥈':'🥉';
  const msg = pct>=80?'Excellent !':pct>=50?'Pas mal !':'Continue de t\'entraîner !';
  showBestScore(currentGame, score);
  addScore(score);
  container.innerHTML = `
    <div class="result-screen">
      <div class="medal">${medal}</div>
      <h3>${title}</h3>
      <div class="pts">${score} / ${max} pts</div>
      <p>${msg} ${detail}</p>
      <div class="result-btns">
        <button class="btn-replay" onclick="startGame('${currentGame}')">🔄 Rejouer</button>
        <button class="btn-menu-r" onclick="backToMenu()">Menu</button>
      </div>
    </div>`;
}

function initQuiz(container) {
  const questions = shuffle([...QUIZ_BANK]).slice(0,10);
  let qi=0, score=0, timer=null, timeLeft=20;

  function render() {
    if(qi>=questions.length){stopTimer();showResult(container,score,questions.length*10,'Quiz terminé !',`${score/10} bonnes réponses sur ${questions.length}.`);return;}
    const q=questions[qi];
    const pct=(qi/questions.length)*100;
    container.innerHTML=`
      <div class="game-header"><h2>🧠 Quiz Chrono</h2>
        <div class="hud">
          <div class="hud-box accent"><div class="v" id="q-score">${score}</div><div class="l">Pts</div></div>
          <div class="hud-box yellow"><div class="v" id="q-timer">${timeLeft}</div><div class="l">Sec</div></div>
          <div class="hud-box"><div class="v">${qi+1}/${questions.length}</div><div class="l">Q.</div></div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="quiz-q"><div class="num">Question ${qi+1}</div><div class="text">${q.q}</div></div>
      <div class="quiz-opts">${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}</div>
      <div class="quiz-feedback" id="q-feedback"></div>
      <button class="btn-next" id="q-next" onclick="nextQuiz()">Question suivante →</button>`;
    startTimer();
  }

  function startTimer(){timeLeft=20;if(timer)clearInterval(timer);timer=setInterval(()=>{timeLeft--;const el=document.getElementById('q-timer');if(el)el.textContent=timeLeft;if(timeLeft<=0){clearInterval(timer);answerQuiz(-1);}},1000);}
  function stopTimer(){if(timer)clearInterval(timer);}

  window.answerQuiz=(idx)=>{
    stopTimer();const q=questions[qi];
    document.querySelectorAll('.quiz-opt').forEach(o=>o.classList.add('disabled'));
    const fb=document.getElementById('q-feedback'),next=document.getElementById('q-next');
    if(idx===q.ans){document.querySelectorAll('.quiz-opt')[idx].classList.add('correct');score+=10;document.getElementById('q-score').textContent=score;fb.textContent='✅ Correct ! '+q.exp;fb.className='quiz-feedback ok';fb.style.display='block';}
    else{if(idx>=0)document.querySelectorAll('.quiz-opt')[idx].classList.add('wrong');document.querySelectorAll('.quiz-opt')[q.ans].classList.add('correct');fb.textContent='❌ '+q.exp;fb.className='quiz-feedback err';fb.style.display='block';}
    if(next)next.style.display='inline-block';
  };
  window.nextQuiz=()=>{qi++;render();};
  render();
}

function initTri(container) {

  function render(){
    const remaining=items.filter(i=>!dropped[i.id]).length;
    container.innerHTML=`

        <div class="hud">
          <div class="hud-box accent"><div class="v">${Object.keys(dropped).length}</div><div class="l">Triés</div></div>

          <div class="tri-item${selectedId===it.id?' tri-selected':''}" onclick="triSelect('${it.id}')">${it.label}</div>`).join('')}
        ${remaining===0?'<p style="color:var(--muted);font-size:.82rem;">Tous les articles ont été triés !</p>':''}
      </div>
      ${selectedId?`<p style="color:var(--yellow);font-size:.8rem;text-align:center;margin-bottom:10px;">✋ Sélectionné : <strong>${items.find(i=>i.id===selectedId).label}</strong><br>👇 Choisis une zone</p>`:''}
      <div class="tri-zone-wrapper">
        <div class="tri-zone zone-stock${selectedId?' tri-zone-active':''}" onclick="triPlace('stock')">
          <div class="tri-zone-header"><div class="zone-icon">✅</div><h4>Remise en stock</h4></div>
          <div>${items.filter(it=>dropped[it.id]==='stock').map(it=>`<div class="dropped-item" data-id="${it.id}">${it.label}</div>`).join('')}</div>
        </div>
        <div class="tri-zone zone-sav${selectedId?' tri-zone-active':''}" onclick="triPlace('sav')">
          <div class="tri-zone-header"><div class="zone-icon">🔧</div><h4>SAV / Reconditionn.</h4></div>
          <div>${items.filter(it=>dropped[it.id]==='sav').map(it=>`<div class="dropped-item" data-id="${it.id}">${it.label}</div>`).join('')}</div>
        </div>
        <div class="tri-zone zone-rebut${selectedId?' tri-zone-active':''}" onclick="triPlace('rebut')">
          <div class="tri-zone-header"><div class="zone-icon">🗑️</div><h4>Rebut / Destruction</h4></div>
          <div>${items.filter(it=>dropped[it.id]==='rebut').map(it=>`<div class="dropped-item" data-id="${it.id}">${it.label}</div>`).join('')}</div>
        </div>
      </div>
      ${remaining===0?`<button class="btn-next" style="display:inline-block;margin-top:12px;" onclick="validerTri()">Valider le tri ✓</button>`:''}`;
  }

  window.triSelect=(id)=>{selectedId=(selectedId===id)?null:id;render();};
  window.triPlace=(zone)=>{if(!selectedId)return;dropped[selectedId]=zone;selectedId=null;render();};
  window.validerTri=()=>{
    let pts=0;
    items.forEach(item=>{
      const el=document.querySelector(`[data-id="${item.id}"]`);if(!el)return;
      const names={stock:'Remise en stock',sav:'SAV',rebut:'Rebut'};
      if(dropped[item.id]===item.zone){el.classList.add('ok');el.textContent='✅ '+item.label;pts+=10;}
      else{el.classList.add('err');el.textContent='❌ '+item.label+` → ${names[item.zone]}`;}
    });
    document.querySelector('.btn-next') && (document.querySelector('.btn-next').style.display='none');
    setTimeout(()=>showResult(container,pts,items.length*10,'Tri terminé !',`${pts/10} articles corrects sur ${items.length}.`),1400);
  };
  render();
}

  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}

  function render(){
    container.innerHTML=`
      <div class="game-header"><h2>🃏 Memory CACES</h2>
        <div class="hud">
          <div class="hud-box green"><div class="v" id="mem-matched">${matched}</div><div class="l">Paires</div></div>
          <div class="hud-box"><div class="v" id="mem-moves">${moves}</div><div class="l">Essais</div></div>
        </div>
      </div>
      <p style="color:var(--muted);font-size:.82rem;margin-bottom:10px;">Retrouve les paires engin ↔ CACES.</p>
      <div class="memory-grid" style="grid-template-columns:repeat(4,1fr);">
        ${cards.map(c=>`<div class="mem-card" id="mc-${c.id}" onclick="flipMem('${c.id}')"><div class="back">❓</div><div class="front"><span style="font-size:1.2rem">${c.icon}</span><span>${c.label}</span></div></div>`).join('')}
      </div>`;
  }

  window.flipMem=(id)=>{
    if(locked)return;const card=cards.find(c=>c.id===id);if(!card)return;
    const el=document.getElementById('mc-'+id);
    if(!el||el.classList.contains('matched')||el.classList.contains('flipped'))return;
    el.classList.add('flipped');flipped.push(card);
    if(flipped.length===2){
      moves++;document.getElementById('mem-moves').textContent=moves;locked=true;
      const[c1,c2]=flipped;
      if(c1.pairId===c2.pairId&&c1.side!==c2.side){
        setTimeout(()=>{
          document.getElementById('mc-'+c1.id).classList.add('matched');
          document.getElementById('mc-'+c2.id).classList.add('matched');
          matched++;document.getElementById('mem-matched').textContent=matched;
          flipped=[];locked=false;
          if(matched===pairs.length){const pts=Math.max(120-moves*5,20);setTimeout(()=>showResult(container,pts,120,'Memory réussi !',`${pairs.length} paires en ${moves} essais.`),500);}
        },500);
      }else{
        setTimeout(()=>{document.getElementById('mc-'+c1.id).classList.remove('flipped');document.getElementById('mc-'+c2.id).classList.remove('flipped');flipped=[];locked=false;},900);
      }
    }
  };
  render();
}

function initPalette(container){
  const scenario=PALETTE_BANK[Math.floor(Math.random()*PALETTE_BANK.length)];
  const items=[...scenario.items];
  const shuffled=shuffle([...items]);
  let slots=Array(items.length).fill(null);
  let selectedItem=null;

  function render(){
    const remaining=shuffled.filter(it=>!slots.includes(it)).length;
    const allPlaced=remaining===0;
    container.innerHTML=`
      <div class="game-header"><h2>🏗️ Monte la palette</h2>
        <div class="hud">
          <div class="hud-box accent"><div class="v">${items.length-remaining}</div><div class="l">Placés</div></div>

      </div>
      <p style="color:var(--muted);font-size:.82rem;margin-bottom:4px;"><strong>${scenario.title}</strong></p>
      <p style="color:var(--muted);font-size:.78rem;margin-bottom:12px;"><strong style="color:var(--accent)">1.</strong> Sélectionne un article → <strong style="color:var(--accent)">2.</strong> Clique sur la couche de la palette (couche 1 = bas).</p>
      <div class="palette-pool">
        ${shuffled.map(it=>{
          const placed=slots.includes(it);
          return`<div class="palette-item${selectedItem===it?' pal-selected':''}${placed?' pal-placed':''}" onclick="${placed?'':'palSelect(\''+it.emoji+it.label+'\')'}">${it.emoji} ${it.label}</div>`;
        }).join('')}
      </div>
      ${selectedItem?`<p style="color:var(--yellow);font-size:.8rem;margin-bottom:8px;text-align:center;">✋ Sélectionné : <strong>${selectedItem.emoji} ${selectedItem.label}</strong> — choisis une couche ↓</p>`:''}
      <div class="palette-slots">
        ${slots.map((s,i)=>`
          <div class="palette-slot" onclick="palPlace(${i})">
            <span class="slot-num">Couche ${i+1}</span>
            ${s?`<span>${s.emoji} ${s.label}</span>`:`<span class="slot-placeholder">— libre —</span>`}
          </div>`).join('')}
      </div>
      ${allPlaced?`<button class="btn-next" style="display:inline-block;margin-top:8px;" onclick="validerPalette()">Valider la palette ✓</button>`:''}`;

    // bind select by emoji+label key since items may not be unique objects
    window.palSelect=(key)=>{
      const it=shuffled.find(i=>i.emoji+i.label===key&&!slots.includes(i));
      if(!it)return;
      selectedItem=(selectedItem===it)?null:it;render();
    };
    window.palPlace=(idx)=>{
      if(!selectedItem)return;
      if(slots[idx]!==null){// swap back to pool
        const old=slots[idx];slots[idx]=null;
      }
      slots[idx]=selectedItem;selectedItem=null;render();
    };
  }

  window.validerPalette=()=>{
    let pts=0;
    slots.forEach((item,i)=>{
      if(!item)return;
      const slotEl=document.querySelectorAll('.palette-slot')[i];
      if(item.correct===i){slotEl.classList.add('filled-ok');pts+=10;}
      else{slotEl.classList.add('filled-err');}
    });
    document.querySelector('.btn-next')&&(document.querySelector('.btn-next').style.display='none');
    const tipEl=document.createElement('p');tipEl.style.cssText='color:var(--muted);font-size:.82rem;margin-top:10px;padding:10px;background:var(--card);border-radius:8px;';tipEl.textContent='💡 '+scenario.tip;
    document.getElementById('game-content').appendChild(tipEl);
    setTimeout(()=>showResult(container,pts,items.length*10,'Palette vérifiée !',`${pts/10} articles au bon niveau sur ${items.length}.`),1800);
  };

  render();
}

function initPendu(container){

    const lives=Array(maxErrors).fill(0).map((_,i)=>i<errors?'💀':'❤️').join(' ');
    const display=[...word].map(l=>`<div class="pendu-letter">${found.has(l)?l:' '}</div>`).join('');

          <div class="hud-box green"><div class="v">${[...word].filter(l=>found.has(l)).length}/${word.length}</div><div class="l">Trouvés</div></div>

      </div>
      <div class="pendu-word">${display}</div>
      <div class="pendu-errors" style="margin-bottom:14px;">${lives}</div>
      ${won||lost?'':
        `<div class="pendu-alpha">${alpha.map(l=>`<button class="pendu-btn${found.has(l)?(word.includes(l)?' used-ok':' used-err'):''}" onclick="penduGuess('${l}')" ${found.has(l)?'disabled':''}>${l}</button>`).join('')}</div>`}
      ${won?`<div class="quiz-feedback ok" style="display:block;text-align:center;">🎉 Bravo ! Le mot était bien <strong>${word}</strong></div><button class="btn-next" style="display:inline-block;margin-top:10px;" onclick="startGame('pendu')">Nouveau mot</button><button class="btn-menu-r" style="margin-top:10px;margin-left:10px;" onclick="backToMenu()">Menu</button>`:''}
      ${lost?`<div class="quiz-feedback err" style="display:block;text-align:center;">😢 Perdu ! Le mot était <strong>${word}</strong></div><button class="btn-next" style="display:inline-block;margin-top:10px;" onclick="startGame('pendu')">Réessayer</button><button class="btn-menu-r" style="margin-top:10px;margin-left:10px;" onclick="backToMenu()">Menu</button>`:''}`;

    if(won){const pts=Math.max(60-(errors*8),10);showBestScore(currentGame,pts);addScore(pts);}
    if(lost){showBestScore(currentGame,0);}
    window.penduGuess=(l)=>{found.add(l);if(!word.includes(l))errors++;render();};
  }
  render();
}

const RAPID_BANK = [
  {scenario:"Tu trouves un palette instable dans l'allée, prête à tomber.",choices:["Continuer sans s'en occuper","Sécuriser la zone et prévenir le responsable","La pousser vite pour dégager l'allée","Appeler un collègue pour rigoler"],correct:1,exp:"Une palette instable est un danger immédiat. On sécurise la zone et on prévient le responsable."},
  {scenario:"Tu réalises que tu as préparé 8 articles au lieu de 5 dans une commande.",choices:["Laisser comme ça, ça ne gêne personne","Enlever les articles en trop et remettre à leur place","Expédier quand même puis prévenir après","Jeter les articles en trop"],correct:1,exp:"Il faut corriger immédiatement et remettre les articles en surplus à leur emplacement."},
  {scenario:"Ton scanner tombe en panne en pleine préparation.",choices:["Continuer la préparation à vue sans scanner","Préparer de mémoire","Arrêter et signaler la panne au responsable","Emprunter le scanner d'un collègue sans le dire"],correct:2,exp:"Sans scanner, risque d'erreur. On arrête et on signale la panne pour avoir un équipement fonctionnel."},
  {scenario:"Tu vois un collègue soulever seul une charge de 40 kg.",choices:["Ne rien dire, c'est son problème","Lui proposer de l'aide et lui rappeler les règles","Rire et continuer","Prévenir le chef pour qu'il soit puni"],correct:1,exp:"La solidarité et la prévention font partie du travail. On aide et on rappelle les bonnes pratiques."},
  {scenario:"Tu découvres un produit chimique renversé sur le sol de l'entrepôt.",choices:["Nettoyer rapidement avec un chiffon","Marquer la zone, ne pas toucher et alerter le responsable","Enjamber et continuer","Recouvrir d'une palette"],correct:1,exp:"Produit chimique = danger. On isole la zone, on n'y touche pas et on alerte immédiatement."},
  {scenario:"Tu ne trouves pas la référence A1234 à son emplacement habituel.",choices:["Prendre la référence A1243 qui ressemble","Laisser la ligne vide et passer à la suite","Signaler l'anomalie au responsable avant de continuer","Chercher seul pendant 1 heure"],correct:2,exp:"Toujours signaler les anomalies. L'article peut être en rupture ou mal rangé."},
  {scenario:"Un client se plaint directement à toi que sa commande est mauvaise.",choices:["Lui dire que c'est la faute du transporteur","Prendre ses coordonnées et transmettre au service client","Lui proposer un remboursement immédiat","Ignorer la plainte"],correct:1,exp:"Le préparateur n'est pas en contact client direct. On prend les infos et on transmet au service compétent."},
  {scenario:"Tu as très mal au dos depuis ce matin mais tu dois finir ta tournée.",choices:["Continuer sans rien dire pour ne pas gêner","Prendre des pauses plus fréquentes discrètement","Prévenir ton responsable et consulter la médecine du travail","Prendre des médicaments et accélérer"],correct:2,exp:"La santé passe avant tout. Le responsable et la médecine du travail peuvent adapter le poste."},
];

function initRapid(container){
  const questions=shuffle([...RAPID_BANK]).slice(0,6);
  let qi=0,score=0;
  function renderQ(){
    if(qi>=questions.length){showResult(container,score,questions.length*15,'Gestion terminée !',`${score/15} bonne(s) décision(s) sur ${questions.length}.`);return;}
    const q=questions[qi];
    container.innerHTML=`
      <div class="game-header"><h2>⚠️ Bonne décision !</h2>
        <div class="hud">
          <div class="hud-box accent"><div class="v">${score}</div><div class="l">Pts</div></div>
          <div class="hud-box"><div class="v">${qi+1}/${questions.length}</div><div class="l">Scén.</div></div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${(qi/questions.length)*100}%"></div></div>
      <div class="rapid-item">
        <div style="font-size:.72rem;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Situation ${qi+1}</div>
        <div class="rapid-scenario">${q.scenario}</div>
        <div class="rapid-choices">
          ${q.choices.map((c,i)=>`<button class="rapid-choice" id="rc-${i}" onclick="rapidAnswer(${i})">${c}</button>`).join('')}
        </div>
      </div>
      <div class="quiz-feedback" id="rapid-fb"></div>
      <button class="btn-next" id="rapid-next" style="display:none" onclick="rapidNext()">Situation suivante →</button>`;
    window.rapidAnswer=(idx)=>{
      document.querySelectorAll('.rapid-choice').forEach(b=>b.classList.add('disabled'));
      const fb=document.getElementById('rapid-fb'),next=document.getElementById('rapid-next');
      if(idx===q.correct){document.getElementById('rc-'+idx).classList.add('correct');score+=15;fb.textContent='✅ Bonne décision ! '+q.exp;fb.className='quiz-feedback ok';fb.style.display='block';}
      else{document.getElementById('rc-'+idx).classList.add('wrong');document.getElementById('rc-'+q.correct).classList.add('correct');fb.textContent='❌ Pas la meilleure option. '+q.exp;fb.className='quiz-feedback err';fb.style.display='block';}
      next.style.display='inline-block';
    };
    window.rapidNext=()=>{qi++;renderQ();};
  }
  renderQ();
}
